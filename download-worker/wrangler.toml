name = "axis-downloads"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Stores download totals + per-IP rate limits
[[kv_namespaces]]
binding = "DOWNLOADS"
id = "a247978434e34d23b4b568717fa05565"

[vars]
# Where the real DMG lives (GitHub LFS media URL)
DMG_URL = "https://media.githubusercontent.com/media/AbdelrahmanBerchan/axis.github.io/main/downloads/Axis-0.3.0-arm64.dmg"
DMG_FILENAME = "Axis-0.3.0-arm64.dmg"
# Allowed site origins that may start a download (Referer / Origin check)
ALLOWED_ORIGINS = "https://www.axis-browser.com,https://axis-browser.com,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080,http://127.0.0.1:8080"
# Max *new* device ids one IP can register per day (anti-farm). Same device never re-counts.
MAX_NEW_DEVICES_PER_IP_PER_DAY = "5"
